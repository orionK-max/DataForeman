# DataForeman Docker Compose Configuration
# This configuration works on both Linux and Windows.
# - Linux/macOS: Uses host networking by default for EIP autodiscovery
# - Windows: Installer automatically configures bridge networking in .env file
# For manual Windows setup, see .env.example for required NETWORK_MODE settings.

services:
  db:
    image: postgres:16-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-dF_Pr0d_P@ssw0rd_Ch4ng3_M3_N0w_7a8f9b2c1d4e5f6a}
      POSTGRES_DB: ${PGDATABASE:-dataforeman}
    ports:
      - "${DB_PORT_BINDING:-127.0.0.1:5432:5432}"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    command: [
      "postgres",
      "-c","logging_collector=on",
      "-c","log_destination=csvlog",
      "-c","log_directory=/var/log/postgresql",
      "-c","log_filename=postgres-%Y-%m-%d_%H%M",
      "-c","log_rotation_age=60",
      "-c","log_rotation_size=0",
      "-c","log_min_duration_statement=500"
    ]

  nats:
    image: nats:2-alpine
    command: ["-js", "-l", "/var/log/nats/nats.current"]
    ports:
      - "${NATS_PORT_BINDING:-127.0.0.1:4222:4222}"  # Only accessible from localhost (needed for connectivity service with host network)
      # - "8222:8222"  # REMOVED - NATS HTTP should not be exposed
    volumes:
      - ./logs/nats:/var/log/nats

  broker:
    image: emqx/nanomq:0.22.4-full
    restart: always
    environment:
      NANOMQ_ALLOW_ANONYMOUS: "false"
    ports:
      - "${NANOMQ_MQTT_PORT:-1883}:1883"        # MQTT
      - "${NANOMQ_WS_PORT:-8081}:8081"          # WebSocket
      - "127.0.0.1:${NANOMQ_HTTP_PORT:-8001}:8001"  # HTTP API — localhost only
      # 8883 (MQTT over TLS) intentionally not published — the TLS listener is
      # disabled in nanomq/nanomq.conf, so nothing was ever listening behind
      # this port; publishing it was dead/misleading attack surface (Finding #5).
    volumes:
      - ./logs/broker:/var/log/broker
      - ./nanomq/nanomq.conf:/etc/nanomq.conf:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      core:
        condition: service_healthy

  tsdb:
    image: timescale/timescaledb:latest-pg16
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    environment:
      POSTGRES_USER: ${TSDB_USER:-tsdb}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-tSdb_Pr0d_P@ssw0rd_Ch4ng3_M3_8x9y1z2a3b4c5d6e}
      POSTGRES_DB: ${TSDB_DATABASE:-telemetry}
    ports:
      - "${TSDB_PORT_BINDING:-127.0.0.1:5433:5432}"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    command: [
      "postgres",
      "-c","logging_collector=on",
      "-c","log_destination=csvlog",
      "-c","log_directory=/var/log/postgresql",
      "-c","log_filename=tsdb-%Y-%m-%d_%H%M",
      "-c","log_rotation_age=60",
      "-c","log_rotation_size=0",
      "-c","log_min_duration_statement=500"
    ]

  core:
    image: ghcr.io/orionk-max/dataforeman-core:latest
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FILE: /var/log/core/core.current
      LOG_ROTATE_PERIOD_MINUTES: ${LOG_ROTATE_PERIOD_MINUTES:-1440}
      AUTH_DEV_TOKEN: ${AUTH_DEV_TOKEN:-0}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-dF_Pr0d_P@ssw0rd_Ch4ng3_M3_N0w_7a8f9b2c1d4e5f6a}
      PGDATABASE: ${PGDATABASE:-dataforeman}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Demo mode configuration
      DEMO_MODE: ${DEMO_MODE:-0}
      DEMO_INACTIVE_MINUTES: ${DEMO_INACTIVE_MINUTES:-60}
      DEMO_PASSWORD_PREFIX: ${DEMO_PASSWORD_PREFIX:-Demo}
      # TimescaleDB connection
      TSDB_HOST: tsdb
      TSDB_PORT: 5432
      TSDB_USER: ${TSDB_USER:-tsdb}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-tSdb_Pr0d_P@ssw0rd_Ch4ng3_M3_8x9y1z2a3b4c5d6e}
      TSDB_DATABASE: ${TSDB_DATABASE:-telemetry}
      # Flow script filesystem access
      FLOW_ALLOWED_PATHS: ${FLOW_ALLOWED_PATHS:-/tmp,/var/dataforeman/flows}
      # Job dispatcher concurrency (max concurrent jobs)
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-20}
      # NanoMQ HTTP API credentials
      MQTT_BROKER_HTTP_USER: ${MQTT_BROKER_HTTP_USER:-nmqadmin}
      MQTT_BROKER_HTTP_PASSWORD: ${MQTT_BROKER_HTTP_PASSWORD:-a51e59fffc618902a60a7fffa729e2037663c31934905ff0}
      # Shared secret for the internal system MQTT connection's superuser bypass in
      # /api/mqtt/auth — change this in .env for production (do not rely on the default).
      MQTT_INTERNAL_PASSWORD: ${MQTT_INTERNAL_PASSWORD:-mQi_1nt3rn4l_Ch4ng3_M3_N0w_5f8a2b91c3d4}
      # Shared secret nanomq.conf sends as the x-nanomq-secret header on /api/mqtt/webhook
      # and /api/mqtt/acl calls, so core can verify these broker-only endpoints are actually
      # being called by the broker and not directly from the internet. Must match the
      # literal value baked into nanomq/nanomq.conf (broker image rebuild required to change).
      MQTT_WEBHOOK_SECRET: ${MQTT_WEBHOOK_SECRET:-ed81bf13c2455c5f7106582d070449b2bf91baa36fdbcd01}
      # Forecast service
      FORECAST_SERVICE_URL: ${FORECAST_SERVICE_URL:-http://forecast:8100}
      APP_VERSION: ${APP_VERSION:-0.7.0}
      # Compose project file path — used by the library manager to start/stop extension services
      COMPOSE_PROJECT_FILE: ${COMPOSE_PROJECT_FILE:-/app/docker-compose.yml}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-dataforeman}
      # Server Monitor extension
      SERVER_MONITOR_HOST: ${SERVER_MONITOR_HOST:-}
      SERVER_MONITOR_USER: ${SERVER_MONITOR_USER:-root}
      SERVER_MONITOR_PASSWORD: ${SERVER_MONITOR_PASSWORD:-}
      SERVER_MONITOR_SSH_PORT: ${SERVER_MONITOR_SSH_PORT:-22}
      SERVER_MONITOR_POLL_INTERVAL: ${SERVER_MONITOR_POLL_INTERVAL:-60}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      - db
      - nats
      - tsdb
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "127.0.0.1:${CORE_PORT:-3000}:3000"  # Not exposed externally — frontend uses service name
    volumes:
      - ./logs/core:/var/log/core
      - core-libraries:/app/src/nodes/libraries
      - ./logs/nats:/var/log/nats
      - ./logs/postgres:/var/log/postgresql
      - ./logs/ops:/var/log/ops
      - ./logs/connectivity:/var/log/connectivity
      - ./logs/front:/var/log/front:ro
      - ./var:/app/var
      - ./ops/logging.components.json:/app/ops/logging.components.json:ro
      - ./logs:/app/logs:ro
      - ./spec/connectivity/schemas:/app/spec/connectivity/schemas:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.env:/app/.env:ro

  connectivity:
    image: ghcr.io/orionk-max/dataforeman-connectivity:latest
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # Note: On Linux, copy docker-compose.override.yml.linux to docker-compose.override.yml
    # to enable host networking for EIP autodiscovery (broadcast support).
    # Windows/macOS use default bridge networking (no override needed).
    ports:
      - "${CONNECTIVITY_PORT:-3100}:3100"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"  # Use service name for Docker Compose networking
      SERVICE_ID: connectivity-1
      HOST: 0.0.0.0
      PORT: 3100
      LOG_FILE: /var/log/connectivity/connectivity.current
      ENABLE_MULTIRATE: "true"
      CONNECTIVITY_SCRIPT: src/index-multirate.mjs
      PYCOMM3_ARRAY_MODE: "${PYCOMM3_ARRAY_MODE:-batch}"  # Options: batch (default), individual
      PGHOST: "${PGHOST:-db}"  # Use service name for Docker Compose networking
      PGPORT: 5432
      PGDATABASE: dataforeman
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-dF_Pr0d_P@ssw0rd_Ch4ng3_M3_N0w_7a8f9b2c1d4e5f6a}
      # TimescaleDB connection
      TSDB_HOST: "${TSDB_HOST:-tsdb}"  # Use service name for Docker Compose networking
      TSDB_PORT: 5432
      TSDB_USER: ${TSDB_USER:-tsdb}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-tSdb_Pr0d_P@ssw0rd_Ch4ng3_M3_8x9y1z2a3b4c5d6e}
      TSDB_DATABASE: ${TSDB_DATABASE:-telemetry}
    depends_on:
      nats:
        condition: service_started
      tsdb:
        condition: service_started
      db:
        condition: service_started
      core:
        condition: service_healthy
    volumes:
      - ./logs/connectivity:/var/log/connectivity
      - ./spec/connectivity/schemas:/app/spec/connectivity/schemas:ro

  front:
    image: ghcr.io/orionk-max/dataforeman-front:latest
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - core
    ports:
      - "${FRONT_PORT:-8080}:80"
    volumes:
      - ./logs/front:/var/log/front

  rotator:
    image: ghcr.io/orionk-max/dataforeman-ops:latest
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOG_ROTATE_PERIOD_MINUTES: ${LOG_ROTATE_PERIOD_MINUTES:-1440}
    depends_on:
      - core
      - nats
      - db
      - tsdb

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - front

  forecast:
    image: ghcr.io/orionk-max/dataforeman-forecast:${FORECAST_IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: ["forecast"]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./var/hf-model-cache:/root/.cache/huggingface
    # Internal only — only core needs to reach it.
    expose:
      - "8100"

  # Tuya smart-device driver sidecar (installable-drivers framework, Phase 1 pilot).
  # Off by default; enabled via the Library Manager when the "tuya" extension is installed.
  tuya-driver:
    image: ghcr.io/orionk-max/dataforeman-tuya-driver:${TUYA_DRIVER_IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: ["tuya"]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    environment:
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
      PGHOST: "${PGHOST:-db}"
      PGPORT: 5432
      PGDATABASE: dataforeman
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-dF_Pr0d_P@ssw0rd_Ch4ng3_M3_N0w_7a8f9b2c1d4e5f6a}
    depends_on:
      - nats
      - db
    # Internal only — only connectivity needs to reach it.
    expose:
      - "8200"

volumes:
  db-data:
  tsdb-data:
  core-libraries:
